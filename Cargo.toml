[workspace]
resolver = "3"
members = ["crates/witgraph-ir", "crates/witgraph-wit", "crates/witgraph-traits", "crates/witgraph-sched", "crates/witgraph-runtime", "crates/witgraph-web", "crates/witgraph-probes", "crates/witgraph-source", "crates/witgraph-remote", "test-fixtures/test-components", "test-fixtures/doc-snippets", "test-fixtures/host-plane", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/sansmoraxz/witgraph"
readme = "README.md"
keywords = ["wasm", "webassembly", "component-model", "dataflow", "wit"]
categories = ["wasm"]

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# Diagnostics are data, never panics (see witgraph-ir::diagnostics). Test
# code is exempted via clippy.toml's allow-*-in-tests.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
witgraph-ir = { path = "crates/witgraph-ir", version = "0.1.0" }
witgraph-wit = { path = "crates/witgraph-wit", version = "0.1.0" }
witgraph-traits = { path = "crates/witgraph-traits", version = "0.1.0" }
witgraph-sched = { path = "crates/witgraph-sched", version = "0.1.0" }
witgraph-probes = { path = "crates/witgraph-probes", version = "0.1.0" }
witgraph-runtime = { path = "crates/witgraph-runtime", version = "0.1.0" }
semver = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
gimli = { version = "0.33", default-features = false, features = ["read", "std", "endian-reader"] }
miette = "7.6"
nutype = "0.8"
petgraph = { version = "0.8", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
sha2 = "0.11"
# wasmtime and the wasm-tools crates move together: this wasmtime is built on
# wasm-tools 0.263. Bump every wasm-tools crate below together with wasmtime.
# Bugs in wasmtime, wit-parser and wac are fixed on `witgraph-patches` in our
# forks.
#
# wasmtime's is on upstream main, for the fix for a table leak in
# guest-to-guest async calls, not in 50.0.1, and keeps a component's
# breakpoints when single-stepping ends.
wasmtime = { git = "https://github.com/sansmoraxz/wasmtime", rev = "3bf0aff7612b91910772b3ceb0137aed4f3e7022", default-features = false }
wit-parser = "0.263"
wit-component = "0.263"
wasmparser = { version = "0.263", default-features = false }
wasm-encoder = "0.263"
wac-graph = { git = "https://github.com/sansmoraxz/wac", rev = "05bcb89620a17b2c8d14d0c6bb0a516dd8daed5b" }
wasm-wave = { version = "0.263", default-features = false, features = ["std"] }

[profile.dev.package."*"]
opt-level = 1

[patch.crates-io]
wasm-encoder = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wasm-metadata = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wasm-wave = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wasmparser = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wasmprinter = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wast = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wat = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wit-component = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
wit-parser = { git = "https://github.com/sansmoraxz/wasm-tools", rev = "774832120e5640db309c0d74070b35c5ee05255f" }
