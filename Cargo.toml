[workspace]
resolver = "3"
members = ["crates/witgraph-ir", "crates/witgraph-wit", "crates/witgraph-runtime", "crates/test-components"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/sansmoraxz/witgraph"
readme = "README.md"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# Diagnostics are data, never panics (see witgraph-ir::diagnostics). Test
# code is exempted via clippy.toml's allow-*-in-tests.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
witgraph-ir = { path = "crates/witgraph-ir" }
witgraph-runtime = { path = "crates/witgraph-runtime" }
semver = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
miette = "7.6"
nutype = "0.8"
petgraph = { version = "0.8", default-features = false }
strum = { version = "0.27", default-features = false, features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
sha2 = "0.10"
# wasmtime and the wasm-tools crates move together: wasmtime 49 is built on
# wasm-tools 0.258, and guests use the matching wit-bindgen 0.61.
wasmtime = { version = "49.0.1", default-features = false }
wit-parser = "0.258"
wit-component = "0.258"
wasm-wave = { version = "0.258", default-features = false, features = ["std"] }
