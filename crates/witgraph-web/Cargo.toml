[package]
name = "witgraph-web"
description = "The witgraph scheduler for JavaScript hosts: a browser executor over jco-transpiled nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Its output ships inside the npm loader package, not on crates.io.
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# A trap's fault message lists the WebAssembly frames of its stack, with the
# offsets `wasm-tools addr2line` takes. Without it the message is the trap's
# alone.
addr2line = []

# Everything here is for WebAssembly (`wasm32`, or `wasm64` opting in): on
# other targets the crate is empty.
[target.'cfg(target_family = "wasm")'.dependencies]
witgraph-ir = { workspace = true }
witgraph-traits = { workspace = true }
witgraph-wit = { workspace = true, features = ["compose"] }
witgraph-sched = { workspace = true }
witgraph-probes = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
miette = { workspace = true }
