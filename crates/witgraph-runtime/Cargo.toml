[package]
name = "witgraph-runtime"
description = "Component-model graph runtime for witgraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
witgraph-ir = { workspace = true }
witgraph-wit = { path = "../witgraph-wit" }
wit-parser = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
futures = "0.3"
wasmtime = { workspace = true, features = [
    "runtime", "cranelift", "component-model", "component-model-async", "async", "std",
    "wave",
] }
serde = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "time"] }
test-components = { path = "../test-components" }
