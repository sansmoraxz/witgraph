[package]
name = "witgraph-runtime"
description = "Component-model graph runtime for witgraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
witgraph-ir = { workspace = true }
witgraph-sched = { workspace = true }
witgraph-wit = { path = "../witgraph-wit" }
wac-graph = "0.12"
thiserror = { workspace = true }
miette = { workspace = true }
futures = "0.3"
wasmtime = { workspace = true, features = [
    "runtime", "cranelift", "component-model", "component-model-async", "async", "std",
    "wave", "parallel-compilation",
] }

[dev-dependencies]
wit-parser = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
test-components = { path = "../../test-fixtures/test-components" }
wit-component = { workspace = true, features = ["dummy-module"] }
wat = "1"
