[package]
name = "witgraph-runtime"
description = "Component-model graph runtime for witgraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
witgraph-ir = { workspace = true }
witgraph-sched = { workspace = true }
witgraph-traits = { workspace = true }
witgraph-wit = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
futures = "0.3"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# The features the runtime cannot work without. Everything else is opt-in below.
wasmtime = { workspace = true, features = [
    "runtime", "component-model", "component-model-async", "task-group-hook", "async", "std", "wave",
] }

witgraph-probes = { workspace = true, optional = true }

[features]
default = ["compile", "parallel-compilation"]
# Compiling components from their bytes, with Cranelift, and composing their
# links. Without it a graph loads only from `precompiled` components.
compile = ["wasmtime/cranelift", "witgraph-wit/compose"]
# Saving prepared components and loading them back without compiling.
precompiled = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:hex"]
# Each of these turns on the wasmtime feature of the same name, so code that
# reaches wasmtime through this crate's `wasmtime` re-export can use it
# without a second dependency on wasmtime.
parallel-compilation = ["compile", "wasmtime/parallel-compilation"]
cache = ["wasmtime/cache"]
profiling = ["wasmtime/profiling"]
pooling-allocator = ["wasmtime/pooling-allocator"]
wat = ["wasmtime/wat"]
demangle = ["wasmtime/demangle"]
addr2line = ["wasmtime/addr2line"]
coredump = ["wasmtime/coredump"]
debug = ["wasmtime/debug", "dep:witgraph-probes"]

[dev-dependencies]
wit-parser = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
test-components = { path = "../../test-fixtures/test-components" }
wit-component = { workspace = true, features = ["dummy-module"] }
wat = "1"

[[example]]
name = "precompiled"
required-features = ["precompiled"]
