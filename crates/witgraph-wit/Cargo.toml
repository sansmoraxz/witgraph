[package]
name = "witgraph-wit"
description = "WIT ingestion and component contract generation for witgraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
witgraph-ir = { workspace = true }
wasm-wave = { workspace = true, features = ["wit"] }
wit-parser = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
wasmparser = { workspace = true, features = ["std", "validate", "component-model", "features"] }
wac-graph = { workspace = true, optional = true }
wasm-encoder = { workspace = true, optional = true }
wit-component = { workspace = true }
semver = { workspace = true, optional = true, features = ["std"] }

[features]
# Composing a node with the providers its links name (`compose`).
compose = ["dep:wac-graph", "dep:wasm-encoder", "dep:semver"]

[dev-dependencies]
wat = "1"
wit-component = { workspace = true, features = ["dummy-module"] }
