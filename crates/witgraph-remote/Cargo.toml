[package]
name = "witgraph-remote"
description = "Lets a debugger attach to a graph running on wasmtime, over wRPC on WebTransport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
witgraph-runtime = { path = "../witgraph-runtime", features = ["debug"] }
wit-bindgen-wrpc = { git = "https://github.com/sansmoraxz/wrpc", rev = "d536f195fb5a25bb2df59f875c19f2ca6921b503" }
wrpc-transport = { git = "https://github.com/sansmoraxz/wrpc", rev = "d536f195fb5a25bb2df59f875c19f2ca6921b503" }
wrpc-webtransport = { git = "https://github.com/sansmoraxz/wrpc", rev = "d536f195fb5a25bb2df59f875c19f2ca6921b503" }
witgraph-ir = { path = "../witgraph-ir" }
futures = "0.3"
quinn = { version = "0.11.6", default-features = false, features = ["log", "ring", "runtime-tokio", "rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.50", features = ["macros", "net", "rt", "sync", "time"] }
web-transport-quinn = { version = "0.13.5", default-features = false, features = ["ring"] }

[dev-dependencies]
test-components = { path = "../../test-fixtures/test-components" }
tokio = { version = "1.50", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
witgraph-wit = { path = "../witgraph-wit" }
